name: CI

on:
  pull_request:
  push:
    branches:
      - main

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npm run playground:build
      - run: npm run docs:api
      - run: npm run pack:dry
      - run: npm run smoke:install
      - run: npm run os-probabilities -- scenario examples/real-scenarios/lootbox-pity-event/scenario.yaml
      - run: npm run os-probabilities -- scenario examples/real-scenarios/live-event-lootbox/scenario.yaml

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m unittest discover -s tools/python/tests

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal
      - run: rustup target add wasm32-unknown-unknown
      - run: cargo test --workspace --locked
      - run: cargo build -p os-probabilities-wasm --target wasm32-unknown-unknown --locked

