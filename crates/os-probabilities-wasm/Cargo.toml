[package]
name = "os-probabilities-wasm"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "WASM bindings for OS Probabilities deterministic primitives."

[lib]
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[dependencies]
js-sys = "0.3"
os-probabilities-core = { path = "../os-probabilities-core" }
wasm-bindgen = "0.2"
